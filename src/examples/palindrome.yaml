name: palindrome
source code: |
  # Accepts palindromes made of the symbols 'a' and 'b'
  input: 'abba' # try a, ab, bb, babab
  blank: ' '
  start state: start
  synonyms:
    accept: {write: '', move: R, nextState: accept}
    reject: {write: '', move: R, nextState: reject}
  # A palindrome is either the empty string, a single symbol,
  # or a (shorter) palindrome with the same symbol added to both ends.
  table:
    start:
      a: {write: ' ', move: R, nextState: haveA}
      b: {write: ' ', move: R, nextState: haveB}
      ' ': accept
    haveA:
      [a,b]: {write: '', move: R, nextState: haveA}
      ' ': {write: '', move: L, nextState: matchA}
    haveB:
      [a,b]: {write: '', move: R, nextState: haveB}
      ' ': {write: '', move: L, nextState: matchB}
    matchA:
      a: {write: ' ', move: L, nextState: back}
      b: reject
      ' ': accept
    matchB:
      a: reject
      b: {write: ' ', move: L, nextState: back}
      ' ': accept
    back:
      [a,b]: {write: '', move: L, nextState: back}
      ' ': {write: '', move: R, nextState: start}
    accept:
    reject:


  # Exercise:

  # • Modify the machine to include 'c' in the symbol alphabet,
  #   so it also works for strings like 'cabbac'.
positions:
  haveA:  {x: 240, y: 185}
  start:  {x: 400, y: 185}
  haveB:  {x: 560, y: 185}

  matchA: {x: 240, y: 315}
  back:   {x: 400, y: 315}
  matchB: {x: 560, y: 315}

  accept: {x: 400, y: 55}
  reject: {x: 400, y: 445}

name: binary multiplication
source code: |
  # Multiplies two binary numbers together.

  # Examples: '11*11' => '1001', '111*110' => '101010'.
  input: '11*101' # 3*5 = 15 (1111 in binary)
  blank: ' '
  start state: start
  table:
    # Prefix the input with a '+', and go to the rightmost digit.
    start:
      [0,1]: {write: '', move: L, nextState: init}
    init:
      ' ': {write: '+', move: R, nextState: right}
    right:
      [0,1,'*']: {write: '', move: R, nextState: right}
      ' ': {write: '', move: L, nextState: readB}

    # Read and erase the last digit of the multiplier.
    # If it's 1, add the current multiplicand.
    # In any case, double the multiplicand afterwards.
    readB:
      0: {write: ' ', move: L, nextState: doubleL}
      1: {write: ' ', move: L, nextState: addA}
    addA:
      [0,1]: {write: '', move: L, nextState: addA}
      '*': {write: '', move: L, nextState: read}
    # Double the multiplicand by appending a 0.
    doubleL:
      [0,1]: {write: '', move: L, nextState: doubleL}
      '*': {write: 0, move: R, nextState: shift}
    double: # return from adder
      [0,1,+]: {write: '', move: R, nextState: double}
      '*': {write: 0, move: R, nextState: shift}
    # Make room by shifting the multiplier right 1 cell.
    shift:
      0: {write: '*', move: R, nextState: shift0}
      1: {write: '*', move: R, nextState: shift1}
      ' ': {write: '', move: L, nextState: tidy}
    shift0:
      0:   {write: '', move: R, nextState: shift0}
      1:   {write: 0, move: R, nextState: shift1}
      ' ': {write: 0, move: R, nextState: right}
    shift1:
      0:   {write: 1, move: R, nextState: shift0}
      1:   {write: '', move: R, nextState: shift1}
      ' ': {write: 1, move: R, nextState: right}

    tidy:
      [0,1]: {write: ' ', move: L, nextState: tidy}
      +: {write: ' ', move: L, nextState: done}
    done:

  # This is the 'binary addition' machine almost verbatim.
  # It's adjusted to keep the '+'
  # and to lead to another state instead of halting.
    read:
      0: {write: c, move: L, nextState: have0}
      1: {write: c, move: L, nextState: have1}
      +: {write: '', move: L, nextState: rewrite}
    have0:
      [0,1]: {write: '', move: L, nextState: have0}
      +: {write: '', move: L, nextState: add0}
    have1:
      [0,1]: {write: '', move: L, nextState: have1}
      +: {write: '', move: L, nextState: add1}
    add0:
      [0,' ']: {write: O, move: R, nextState: back0}
      1      : {write: I, move: R, nextState: back0}
      [O,I]  : {write: '', move: L, nextState: add0}
    add1:
      [0,' ']: {write: I, move: R, nextState: back1}
      1      : {write: O, move: L, nextState: carry}
      [O,I]  : {write: '', move: L, nextState: add1}
    carry:
      [0,' ']: {write: 1, move: R, nextState: back1}
      1      : {write: 0, move: L, nextState: carry}
    back0:
      [0,1,O,I,+]: {write: '', move: R, nextState: back0}
      c: {write: 0, move: L, nextState: read}
    back1:
      [0,1,O,I,+]: {write: '', move: R, nextState: back1}
      c: {write: 1, move: L, nextState: read}
    rewrite:
      O: {write: 0, move: L, nextState: rewrite}
      I: {write: 1, move: L, nextState: rewrite}
      [0,1]: {write: '', move: L, nextState: rewrite}
      ' ': {write: '', move: R, nextState: double}


  # Remark:
  # We can view the machine as expressing a recursive function:

  #   multiply(a, b) = mult(0, a, b)

  #   mult(acc, a, 0     ) = acc
  #   mult(acc, a, 2k + 0) = mult(acc    , 2a, k)   where k ≠ 0
  #   mult(acc, a, 2k + 1) = mult(acc + a, 2a, k)

  # where a, b, and k are natural numbers.

  # Each reduction maintains the invariant
  #   mult(acc, a, b) = acc + a * b
  # Note that mult's third argument (b) is always decreasing,
  # so mult is guaranteed to halt.
  # Eventually b reaches 0 and the result is simply the accumulator.
positions:
  start:  {x: 80 , y: 70}
  init:   {x: 190, y: 70}
  tidy:   {x: 730, y: 70}
  done:   {x: 730, y: 180}

  right:  {x: 300, y: 115}
  shift:  {x: 600, y: 115}
  shift1: {x: 450, y: 70}
  shift0: {x: 450, y: 160}

  readB:  {x: 300, y: 215}
  addA:   {x: 160, y: 215}
  doubleL: {x: 550, y: 215}

  rewrite: {x: 363, y: 300}
  double: {x: 650, y: 300}

  back0:  {x: 160, y: 370}
  read:   {x: 300, y: 370}
  back1:  {x: 440, y: 370}
  carry:  {x: 540, y: 370}

  add0:   {x:  60, y: 470}
  have0:  {x: 200, y: 470}
  have1:  {x: 400, y: 470}
  add1:   {x: 540, y: 470}

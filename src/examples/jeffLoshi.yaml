  # Writes "Jeff" or "Loshi" depending on input
  input: 'F'
  blank: ' '
  start state: start
  table:
    start:
      F: {write: J, move: R, nextState: f2}
      L: {write: Y, move: R, nextState: l2}
    f2:
      ' ': {write: e, move: R, nextState: f3}
    f3:
      ' ': {write: f, move: R, nextState: f4}
    f4:
      ' ': {write: f, move: R, nextState: done}
    l2:
      ' ': {write: o, move: R, nextState: l3}
    l3:
      ' ': {write: s, move: R, nextState: l4}
    l4:
      ' ': {write: h, move: R, nextState: l5}
    l5:
      ' ': {write: i, move: R, nextState: l6}
    l6:
      ' ': {write: m, move: R, nextState: l7}
    l7:
      ' ': {write: i, move: R, nextState: done}
    done:

name: unary multiplication
source code: |
  # Multiplies together two unary numbers separated by a '*'.
  # (Unary is like tallying. Here '||*|||' means 2 times 3.)
  input: '||*|||' # try '*', '|*|||', '||||*||'
  blank: ' '

  # The idea:
  #   multiply(0, b) = 0
  #   multiply(a, b) = b + multiply(a-1, b)   when a > 0
  start state: eachA
  table:
    # For each 1 in a, add a copy of b.
    eachA:
      '|': {write: ' ', move: R, nextState: toB}
      '*': {write: '', move: R, nextState: skip}
    toB:
      '|': {write: '', move: R, nextState: toB}
      '*': {write: '', move: R, nextState: eachB}
    nextA: # return from copier
      ' ': {write: '|', move: R, nextState: eachA}
      ['|','*']: {write: '', move: L, nextState: nextA}

    skip:
      '|': {write: '', move: R, nextState: skip}
      ' ': {write: '', move: R, nextState: done}
    done:

    # This is the 'copy 1s' machine, with ' ' as 0 and '|' as 1.
    eachB:
      ' ': {write: '', move: L, nextState: nextA}
      '|': {write: ' ', move: R, nextState: sep}
    sep:
      ' ': {write: '', move: R, nextState: add}
      '|': {write: '', move: R, nextState: sep}
    add:
      ' ': {write: '|', move: L, nextState: sepL}
      '|': {write: '', move: R, nextState: add}
    sepL:
      ' ': {write: '', move: L, nextState: nextB}
      '|': {write: '', move: L, nextState: sepL}
    nextB:
      ' ': {write: '|', move: R, nextState: eachB}
      '|': {write: '', move: L, nextState: nextB}

positions:
  eachA:  {x: 400, y:  50}
  toB:    {x: 400, y: 150}
  eachB:  {x: 400, y: 250}
  sep:   {x: 400, y: 350}
  add:   {x: 400, y: 450}

  sepL:  {x: 280, y: 350}
  nextB:  {x: 280, y: 250}

  nextA:  {x: 280, y: 90}
  skip:   {x: 520, y: 90}
  done:   {x: 520, y: 190}

name: multiplied lengths
source code: |
  # Decides the language { a^(i)b^(j)c^(k) | i*j = k and i,j,k ≥ 1 }.
  # (a's followed by b's then c's,
  # where the number of a's multiplied by the number of b's
  # equals the number of c's.)
  input: aabbbcccccc # try abc, b, aabcbc, aabcc, aabbbbcccccccc
  blank: ' '
  start state: start

  table:
    # Check for the form a^(i)b^(j)c^(k) where i,j,k ≥ 1.
    start:
      a: {write: '', move: R, nextState: a+}
    a+:
      a: {write: '', move: R, nextState: a+}
      b: {write: '', move: R, nextState: b+}
    b+:
      b: {write: '', move: R, nextState: b+}
      c: {write: '', move: R, nextState: c+}
    c+:
      c: {write: '', move: R, nextState: c+}
      ' ': {write: '', move: L, nextState: left}
    left:
      [a,b,c]: {write: '', move: L, nextState: left}
      ' ': {write: '', move: R, nextState: eachA}
    # Then check that i*j = k.
    #   The approach is two nested loops:
    #   For each 'a':
    #     For each 'b':
    #       Mark one 'c'
    #   At the end, check that all c's are marked.
    eachA:
      a: {write: ' ', move: R, nextState: eachB}
      b: {write: '', move: R, nextState: scan}
    eachB:
      a: {write: '', move: R, nextState: eachB}
      b: {write: B, move: R, nextState: markC}
      C: {write: '', move: L, nextState: nextA}
    markC:
      [b,C]: {write: '', move: R, nextState: markC}
      c: {write: C, move: L, nextState: nextB}
    nextB:
      [b,C]: {write: '', move: L, nextState: nextB}
      B: {write: '', move: R, nextState: eachB}
    nextA:
      a: {write: '', move: L, nextState: nextA}
      B: {write: b, move: L, nextState: nextA}
      ' ': {write: '', move: R, nextState: eachA}

    scan:
      [b,C]: {write: '', move: R, nextState: scan}
      ' ': {write: '', move: R, nextState: accept}
    accept:
positions:
  start:  {x: 180, y: 40}
  a+:     {x: 180, y: 180}
  b+:     {x: 180, y: 320}
  c+:     {x: 180, y: 460}
  left:   {x: 290, y: 320}

  accept: {x: 400, y: 40}
  eachA:  {x: 400, y: 180}
  eachB:  {x: 400, y: 320}
  markC:  {x: 400, y: 460}

  scan:   {x: 560, y: 180}
  nextA:  {x: 560, y: 320}
  nextB:  {x: 560, y: 460}
